<text x="208" y="176" font-size="92" font-weight="800" fill="#fff" letter-spacing="-3">WoofStore</text>
<text x="92" y="240" font-size="32" font-weight="600" fill="#fff">One store and updater for Arch Linux.</text>
<text x="92" y="292" font-size="24" fill="#c7c7cc">Flathub, pacman and the AUR in one catalogue.</text>
<text x="92" y="328" font-size="24" fill="#c7c7cc">Native Qt 6 and KDE, with one System Update button.</text>
