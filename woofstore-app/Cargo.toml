[package]
name = "woofstore-app"
description = "WoofStore's window: Qt Quick pages on top of woofstore-system"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "woof-store"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
woofstore-core = { path = "../woofstore-core" }
woofstore-system = { path = "../woofstore-system" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
serde_json = "1"
tempfile = "3"

[build-dependencies]
cxx-qt-build = "0.10"
